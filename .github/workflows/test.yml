name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 不安裝依賴：測試只 import node: builtins 與 lib/。
      - name: Bundle check
        run: node scripts/check.mjs
      - name: Syntax check
        run: node --check lib/index.js
      - name: Tests
        run: npm test
      # Doctor from dsh-plugin-devkit 0.3.0, pinned to its full merge commit so a
      # devkit change cannot alter this CI without a commit here. Bump it on purpose.
      - name: Doctor
        shell: bash
        run: |
          npm i --no-save --prefix "$RUNNER_TEMP/devkit" "https://codeload.github.com/Joker2377/dsh-plugin-devkit/tar.gz/5d9384c62ef086eac661e21ed7098785be304b6d"
          node "$RUNNER_TEMP/devkit/node_modules/dsh-plugin-devkit/scripts/cli.mjs" doctor .
